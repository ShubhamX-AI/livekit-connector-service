services:
  worker:
    build: .
    network_mode: host
    env_file: .env
    shm_size: 2gb
    volumes:
      - ./artifacts:/app/artifacts
    command: ["python3", "-m", "livekit.agents", "start", "agent_run.py"]

  control:
    build: .
    network_mode: host
    env_file: .env
    command: ["python3", "control_run.py"]
