services:
  worker:
    build: .
    env_file: .env
    network_mode: host
    shm_size: 2gb
    restart: unless-stopped
    volumes:
      - ./artifacts:/app/artifacts
    command: ["python3", "-m", "livekit.agents", "start", "agent_run.py"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m

  control:
    build: .
    env_file: .env
    network_mode: host
    restart: unless-stopped
    command: ["python3", "control_run.py"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m