[project]
name = "standalone-google-meet"
version = "0.1.0"
description = "Audio bridge between Google Meet and LiveKit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyJWT==2.13.0",
    "PyVirtualDisplay==3.0",
    "livekit==1.1.8",
    "numpy==2.1.3",
    "selenium==4.27.1",
    "websockets==14.1",
    "python-dotenv==1.2.3",
    "python-xlib==0.33",
]

[dependency-groups]
dev = [
    "ruff==0.9.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/standalone_google_meet"]

[tool.ruff]
line-length = 999
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E722"]